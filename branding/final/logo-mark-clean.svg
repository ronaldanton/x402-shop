<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#030712" rx="32"/>
  <!-- Hexagon -->
  <polygon points="100,8 184,54 184,146 100,192 16,146 16,54" fill="none" stroke="url(#cyber)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner ring -->
  <polygon points="100,18 174,58 174,142 100,182 26,142 26,58" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <!-- AI Chip -->
  <rect x="62" y="62" width="76" height="76" rx="8" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <text x="100" y="106" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">AI</text>
  <!-- Top node -->
  <line x1="100" y1="62" x2="100" y2="22" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="100" cy="16" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <!-- Top-right -->
  <line x1="145" y1="75" x2="168" y2="52" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="172" cy="48" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <!-- Bottom-right -->
  <line x1="145" y1="138" x2="168" y2="160" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="172" cy="164" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <!-- Bottom -->
  <line x1="100" y1="150" x2="100" y2="190" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="100" cy="196" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <!-- Bottom-left -->
  <line x1="55" y1="138" x2="32" y2="160" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="28" cy="164" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
  <!-- Top-left -->
  <line x1="55" y1="75" x2="32" y2="52" stroke="#00A3FF" stroke-width="1.5"/>
  <circle cx="28" cy="48" r="4" fill="#0A1628" stroke="#00A3FF" stroke-width="1.5"/>
</svg>
