<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
    <linearGradient id="cyber-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="coin-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <linearGradient id="wave-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#030712" rx="40"/>

  <!-- Speed lines (left) -->
  <g transform="translate(10, 95)">
    <rect x="0" y="0" width="60" height="5" rx="2.5" fill="url(#fade-left)"/>
    <rect x="15" y="16" width="80" height="5" rx="2.5" fill="url(#fade-left)"/>
    <rect x="30" y="32" width="45" height="5" rx="2.5" fill="url(#fade-left)"/>
  </g>

  <!-- Hexagon AI chip center -->
  <g transform="translate(100, 50)">
    <polygon points="100,0 200,57 200,172 100,229 0,172 0,57" fill="none" stroke="url(#cyber)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="100,10 190,60 190,169 100,219 10,169 10,60" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Central chip -->
    <rect x="60" y="60" width="80" height="80" rx="10" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <text x="100" y="108" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">AI</text>
    
    <!-- Circuit nodes -->
    <line x1="100" y1="60" x2="100" y2="16" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="100" cy="10" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <line x1="150" y1="75" x2="180" y2="45" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="185" cy="40" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <line x1="150" y1="155" x2="180" y2="185" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="185" cy="190" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <line x1="100" y1="170" x2="100" y2="214" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="100" cy="219" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <line x1="50" y1="155" x2="20" y2="185" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="15" cy="190" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
    <line x1="50" y1="75" x2="20" y2="45" stroke="#00A3FF" stroke-width="2"/>
    <circle cx="15" cy="40" r="5" fill="#0A1628" stroke="#00A3FF" stroke-width="2"/>
  </g>

  <!-- Signal waves right -->
  <g transform="translate(305, 100)">
    <path d="M0 0 Q15 -15 35 0" fill="none" stroke="url(#wave-fade)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 16 Q25 -4 50 16" fill="none" stroke="url(#wave-fade)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 32 Q35 10 65 32" fill="none" stroke="url(#wave-fade)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- USDC coin -->
  <g transform="translate(340, 80)">
    <circle cx="25" cy="25" r="24" fill="url(#coin-grad)"/>
    <circle cx="25" cy="25" r="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="25" cy="25" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="25" y="30" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>

  <!-- 402 badge -->
  <g transform="translate(125, 230)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#030712" stroke="url(#badge-border)" stroke-width="2.5"/>
    <text x="28" y="17" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="800" fill="url(#cyber-light)" text-anchor="middle" dominant-baseline="middle">402</text>
    <text x="105" y="17" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600" fill="#94A3B8" text-anchor="middle" dominant-baseline="middle" letter-spacing="1.5">PAYMENT</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(0, 305)">
    <text x="200" y="0" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" dominant-baseline="middle">
      <tspan fill="#FFFFFF">Agent</tspan><tspan fill="url(#cyber-light)">Pay</tspan>
    </text>
  </g>

  <!-- Tagline row -->
  <g transform="translate(0, 335)">
    <line x1="90" y1="340" x2="200" y2="340" stroke="#1E293B" stroke-width="1"/>
    <line x1="200" y1="340" x2="310" y2="340" stroke="#1E293B" stroke-width="1"/>
    <text x="200" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">402 · AI MICROSERVICES</text>
  </g>

  <!-- Feature row -->
  <g transform="translate(20, 360)">
    <!-- No accounts -->
    <circle cx="10" cy="10" r="12" fill="none" stroke="#00A3FF" stroke-width="1.5"/>
    <circle cx="10" cy="6" r="4" fill="none" stroke="#00A3FF" stroke-width="1"/>
    <path d="M4 16 Q10 12 16 16" fill="none" stroke="#00A3FF" stroke-width="1"/>
    <line x1="2" y1="2" x2="18" y2="18" stroke="#00A3FF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="28" y="8" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">NO</text>
    <text x="28" y="18" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">ACCOUNTS</text>

    <!-- No API keys -->
    <g transform="translate(85, 0)">
      <circle cx="10" cy="10" r="12" fill="none" stroke="#00A3FF" stroke-width="1.5"/>
      <circle cx="8" cy="10" r="3" fill="#00A3FF"/>
      <line x1="12" y1="8" x2="20" y2="8" stroke="#00A3FF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="2" x2="18" y2="18" stroke="#00A3FF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="28" y="8" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">NO</text>
      <text x="28" y="18" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">API KEYS</text>
    </g>

    <!-- Pay-per-call -->
    <g transform="translate(170, 0)">
      <rect x="-2" y="-2" width="24" height="24" rx="5" fill="none" stroke="#00A3FF" stroke-width="1.5"/>
      <text x="10" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00A3FF" text-anchor="middle" dominant-baseline="middle">&gt;_</text>
      <text x="28" y="10" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">PAY-PER-CALL</text>
    </g>

    <!-- USDC -->
    <g transform="translate(270, 0)">
      <circle cx="10" cy="10" r="12" fill="none" stroke="#00A3FF" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="7" fill="none" stroke="#00A3FF" stroke-width="1"/>
      <text x="10" y="13" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="700" fill="#00A3FF" text-anchor="middle" dominant-baseline="middle">$</text>
      <text x="28" y="8" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">USDC</text>
      <text x="28" y="18" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">ON BASE</text>
    </g>
  </g>
</svg>
