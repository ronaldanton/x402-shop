<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a0"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9dc3ff"/>
      <stop offset="100%" stop-color="#6ee7a0"/>
    </linearGradient>
  </defs>
  <!-- Background circle (coin/chip) -->
  <circle cx="200" cy="200" r="190" fill="#0b0e14" stroke="url(#ag)" stroke-width="3"/>
  <!-- Outer ring tick marks -->
  <g stroke="#1e2a4a" stroke-width="2">
    <line x1="200" y1="14" x2="200" y2="28"/>
    <line x1="200" y1="372" x2="200" y2="386"/>
    <line x1="14" y1="200" x2="28" y2="200"/>
    <line x1="372" y1="200" x2="386" y2="200"/>
    <line x1="70" y1="70" x2="80" y2="80"/>
    <line x1="320" y1="320" x2="330" y2="330"/>
    <line x1="70" y1="330" x2="80" y2="320"/>
    <line x1="320" y1="70" x2="330" y2="80"/>
  </g>
  <!-- Inner circle -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#141925" stroke-width="1"/>
  <!-- Circuit path (bottom arc) -->
  <path d="M70 280 Q200 360 330 280" fill="none" stroke="#1e2a4a" stroke-width="1.5"/>
  <circle cx="70" cy="280" r="3" fill="#6ee7a0"/>
  <circle cx="330" cy="280" r="3" fill="#6ee7a0"/>
  <!-- Main "A" mark - left leg -->
  <polygon points="200,80 110,290 140,290 160,245 240,245 260,290 290,290 200,80" fill="url(#ag)" opacity="0.95"/>
  <!-- "A" crossbar / arrow - payment arrow -->
  <polygon points="148,215 252,215 252,195 285,225 252,255 252,235 148,235 148,215" fill="url(#bg)"/>
  <!-- Circuit node / AI node on the right -->
  <circle cx="285" cy="225" r="8" fill="#0b0e14" stroke="#9dc3ff" stroke-width="2"/>
  <circle cx="285" cy="225" r="3" fill="#9dc3ff"/>
  <!-- Small pulse line -->
  <path d="M298 225 L315 225" stroke="#9dc3ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="315" cy="225" r="2" fill="#9dc3ff"/>
  <!-- x402 reference dot on left -->
  <circle cx="115" cy="225" r="3" fill="#6ee7a0" opacity="0.6"/>
</svg>
